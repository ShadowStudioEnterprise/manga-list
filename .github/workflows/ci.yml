name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-pwa/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Enforce Spark compatibility (no credentials)
        run: node scripts/check-spark.mjs
      - name: Audit tracked credentials and workflow privileges (offline)
        run: npm run audit:security
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix src-pwa
          npm install --global firebase-tools@15.32.1
          npx playwright install --with-deps chromium firefox
      - name: Audit both dependency lockfiles
        run: npm run audit:dependencies
      - name: Check formatting and lint
        run: npm run lint:check
      - name: Verify sealed ML-09 observations without rewriting originals
        run: node scripts/check-ml09-evidence.mjs
      - name: Build documentation and check links
        run: |
          npm run docs:build
          npm run docs:check
          npm run audit:security:built
      - name: Verify local documentation diagrams, accessibility and links
        run: node scripts/check-docs-portal.mjs
      - name: Verify public landing locally (no Firebase)
        run: npm run test:landing
      - name: Run regression tests
        run: npm test
      - name: Reproduce ML-08 capacity and offline payload sensitivities
        run: |
          mkdir -p capacity-results
          node scripts/model-ml08-capacity.mjs --output capacity-results/ml08-capacity.json
          node scripts/measure-ml08-payload.mjs --output capacity-results/ml08-payload.json
          node scripts/model-ml08-recovery.mjs --output capacity-results/ml08-recovery.json
      - name: Test Firestore rules
        run: firebase emulators:exec --project demo-mangalist --only firestore "npm run test:rules"
      - name: Rehearse ML-12 interrupted deletion with synthetic Auth and Firestore
        run: node scripts/test-firestore-local.mjs --ml12
      - name: Compare ML-08 model with observed emulator documents
        run: |
          node scripts/model-ml08-capacity.mjs --verify-emulator test-results/ml07-consumption.json --output capacity-results/ml08-capacity.json
          cp test-results/ml07-consumption.json capacity-results/ml07-consumption.json
      - name: Test browser flows against emulators
        run: npm run test:e2e
      - name: Build SPA and PWA with demo configuration
        env:
          VITE_FIREBASE_API_KEY: demo-mangalist-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-mangalist.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-mangalist
          VITE_FIREBASE_STORAGE_BUCKET: demo-mangalist.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          VITE_FIREBASE_APP_ID: '1:123456789:web:demo'
        run: |
          npm run build
          npm run build:pwa
      - name: Verify build consistency and source contracts (demo only)
        run: |
          node scripts/build-evidence.mjs verify spa --project demo-mangalist
          node scripts/build-evidence.mjs verify pwa --project demo-mangalist
      - name: Test built PWA update lifecycle locally
        run: npm run test:pwa
      - name: Test compiled Auth memory sessions with isolated emulator transport
        run: npm run test:auth:built
      - name: Preserve local test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ github.run_id }}
          path: |
            test-results/
            capacity-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve demo build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-build-evidence-${{ github.run_id }}
          path: |
            dist/spa/build-info.json
            dist/spa/build-evidence.json
            dist/pwa/build-info.json
            dist/pwa/build-evidence.json
          if-no-files-found: error
          retention-days: 7
