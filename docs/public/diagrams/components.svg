<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 825" role="img" aria-labelledby="title desc">
<title id="title">Componentes y servicios</title>
<desc id="desc">Interfaz · Vue + Quasar. Router, layouts y páginas. Componentes de biblioteca. ImportPreview y ajustes → Estado · Pinia. auth-store → sesión y UID. manga-store → obras y sync. settings-store → preferencias → Servicios del cliente. auth / account / manga. library-cursors / shared-library. import / export / multipart → SDK Firebase. Authentication → identidad. Firestore → datos por UID. Reglas → autorización → Distribución estática. PWA: archivos de aplicación. VitePress: portal independiente. Sin Functions ni SSR. Las condiciones y excepciones se detallan en el texto de la página.</desc>
