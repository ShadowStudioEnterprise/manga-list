<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 825" role="img" aria-labelledby="title desc">
<title id="title">Carga y paginación</title>
<desc id="desc">Consulta Firestore por UID. orderBy(documentId()). limit(5001) en cada rango. 5000 documentos + centinela → ¿Hay más de 5000?. Solo dividir con snapshot servidor. Cerrar padre y abrir hijos. Límites disjuntos por ID → Esperar todos los rangos. Abrir subárboles escalonados. Tope: 10000 obras / 64 rangos. Exceso → error y cerrar listeners → manga-store en memoria. Obras + metadatos de sincronía. Filtros y orden globales. Sin biblioteca persistida en disco → Página visual de 24 tarjetas. useLibraryPagination hace slice. Cambiar página no consulta red. Filtros reinician a página 1. Las condiciones y excepciones se detallan en el texto de la página.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10" fill="#4338ca"/>
</marker>
</defs>
<rect width="320" height="825" rx="12" fill="#f1f0fa"/>
<text x="16" y="30" fill="#4338ca" font-family="system-ui, sans-serif" font-size="12" font-weight="700">IMPLEMENTADO EN EL REPOSITORIO</text>
<g>
<rect x="16" y="56" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="82" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Consulta Firestore por UID</tspan>
<tspan x="30" dy="21">orderBy(documentId())</tspan>
<tspan x="30" dy="21">limit(5001) en cada rango</tspan>
<tspan x="30" dy="21">5000 documentos + centinela</tspan>
</text>
</g>
<path d="M160 165 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="175" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="190" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">si no, pasar al conjunto</text>
<g>
<rect x="16" y="217" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="243" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">¿Hay más de 5000?</tspan>
<tspan x="30" dy="21">Solo dividir con snapshot servidor</tspan>
<tspan x="30" dy="21">Cerrar padre y abrir hijos</tspan>
<tspan x="30" dy="21">Límites disjuntos por ID</tspan>
</text>
</g>
<path d="M160 326 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="336" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="351" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">reunir sin publicar subárbol parcial</text>
<g>
<rect x="16" y="378" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="404" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Esperar todos los rangos</tspan>
<tspan x="30" dy="21">Abrir subárboles escalonados</tspan>
<tspan x="30" dy="21">Tope: 10000 obras / 64 rangos</tspan>
<tspan x="30" dy="21">Exceso → error y cerrar listeners</tspan>
</text>
</g>
<path d="M160 487 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="497" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="512" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">publicar conjunto preparado</text>
<g>
<rect x="16" y="539" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="565" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">manga-store en memoria</tspan>
<tspan x="30" dy="21">Obras + metadatos de sincronía</tspan>
<tspan x="30" dy="21">Filtros y orden globales</tspan>
<tspan x="30" dy="21">Sin biblioteca persistida en disco</tspan>
</text>
</g>
<path d="M160 648 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="658" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="673" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">paginación local</text>
<g>
<rect x="16" y="700" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="726" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Página visual de 24 tarjetas</tspan>
<tspan x="30" dy="21">useLibraryPagination hace slice</tspan>
<tspan x="30" dy="21">Cambiar página no consulta red</tspan>
<tspan x="30" dy="21">Filtros reinician a página 1</tspan>
</text>
</g>
</svg>
