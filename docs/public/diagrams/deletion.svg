<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 986" role="img" aria-labelledby="title desc">
<title id="title">Eliminación ordinaria de cuenta</title>
<desc id="desc">Ajustes · confirmación. Reautenticar contraseña / Google. Comprobar misma sesión. Desuscribir biblioteca al intentar → Crear o conservar marcador. Transacción en users/{uid}. status: deleting + timestamps. No incluye completedAt → Eliminar mangas por lotes. getDocsFromServer, límite 400. Hasta 5 lotes / intento: 2000. Consultar vacío antes de Auth → ¿Consulta vacía confirmada?. No: conservar marcador y error. No: reintentar la limpieza. Sí: continuar hacia Auth → Solo tras consulta vacía. deleteUser en Authentication. Si Auth falla: marcador permanece. Éxito: limpiar estado local → Marcador conservado. Cliente no puede retirarlo. Sin proceso en segundo plano. Revisión manual: propuesta aparte. Las condiciones y excepciones se detallan en el texto de la página.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10" fill="#4338ca"/>
</marker>
</defs>
<rect width="320" height="986" rx="12" fill="#f1f0fa"/>
<text x="16" y="30" fill="#4338ca" font-family="system-ui, sans-serif" font-size="12" font-weight="700">IMPLEMENTADO EN EL REPOSITORIO</text>
<g>
<rect x="16" y="56" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="82" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Ajustes · confirmación</tspan>
<tspan x="30" dy="21">Reautenticar contraseña / Google</tspan>
<tspan x="30" dy="21">Comprobar misma sesión</tspan>
<tspan x="30" dy="21">Desuscribir biblioteca al intentar</tspan>
</text>
</g>
<path d="M160 165 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="175" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="190" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">identidad confirmada</text>
<g>
<rect x="16" y="217" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="243" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Crear o conservar marcador</tspan>
<tspan x="30" dy="21">Transacción en users/{uid}</tspan>
<tspan x="30" dy="21">status: deleting + timestamps</tspan>
<tspan x="30" dy="21">No incluye completedAt</tspan>
</text>
</g>
<path d="M160 326 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="336" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="351" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">antes de borrar obras</text>
<g>
<rect x="16" y="378" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="404" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Eliminar mangas por lotes</tspan>
<tspan x="30" dy="21">getDocsFromServer, límite 400</tspan>
<tspan x="30" dy="21">Hasta 5 lotes / intento: 2000</tspan>
<tspan x="30" dy="21">Consultar vacío antes de Auth</tspan>
</text>
</g>
<path d="M160 487 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="497" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="512" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">error / presupuesto agotado</text>
<g>
<rect x="16" y="539" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="565" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">¿Consulta vacía confirmada?</tspan>
<tspan x="30" dy="21">No: conservar marcador y error</tspan>
<tspan x="30" dy="21">No: reintentar la limpieza</tspan>
<tspan x="30" dy="21">Sí: continuar hacia Auth</tspan>
</text>
</g>
<path d="M160 648 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="658" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="673" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">solo sí · misma sesión</text>
<g>
<rect x="16" y="700" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="726" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Solo tras consulta vacía</tspan>
<tspan x="30" dy="21">deleteUser en Authentication</tspan>
<tspan x="30" dy="21">Si Auth falla: marcador permanece</tspan>
<tspan x="30" dy="21">Éxito: limpiar estado local</tspan>
</text>
</g>
<path d="M160 809 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="819" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="834" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">después de Auth</text>
<g>
<rect x="16" y="861" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="887" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Marcador conservado</tspan>
<tspan x="30" dy="21">Cliente no puede retirarlo</tspan>
<tspan x="30" dy="21">Sin proceso en segundo plano</tspan>
<tspan x="30" dy="21">Revisión manual: propuesta aparte</tspan>
</text>
</g>
</svg>
