<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 825" role="img" aria-labelledby="title desc">
<title id="title">Revisión manual propuesta · no activa</title>
<desc id="desc">Expediente y roles pendientes. Canal privado e identidad. Autoridad y alcance por caso. Operador y revisor distintos → Finalización acreditada. Inventario actual de descendientes. Estado Auth y evidencia técnica. No inferir fin desde updatedAt → Revisión a las 720 horas. Desde finalización acreditada. Reloj de derechos separado. Nunca retirar por antigüedad sola → Decisión humana documentada. Dudas / excepción: conservar. Datos pendientes: escalar. Condiciones completas: proponer → Autorización futura separada. No ejecutor ni retirada automática. Revisión jurídica aún pendiente. Sin cron, TTL ni Functions. Las condiciones y excepciones se detallan en el texto de la página.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10" fill="#4338ca"/>
</marker>
</defs>
