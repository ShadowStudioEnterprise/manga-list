<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 825" role="img" aria-labelledby="title desc">
<title id="title">Exportación y copia dividida</title>
<desc id="desc">Petición de exportación. Exigir biblioteca sin error. Sin escrituras pendientes. Guardar revisión local inicial → Leer servidor por cursores. Hasta 5001 docs por consulta. Avanzar desde último ID usado. Comprobar sesión en cada página → Verificar antes de descargar. Sin caché ni escrituras pendientes. Máximo 10000; fallo → sin copia. UID y revisión local sin cambios → JSON / CSV o copia dividida. JSON v2 incluye procedencia. CSV neutraliza fórmulas. Copia grande: partes + manifiesto → Restaurar copia dividida. Verificar conjunto y hashes. Vincular plan al UID actual. Reanudar con IDs estables. Las condiciones y excepciones se detallan en el texto de la página.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10" fill="#4338ca"/>
</marker>
</defs>
<rect width="320" height="825" rx="12" fill="#f1f0fa"/>
<text x="16" y="30" fill="#4338ca" font-family="system-ui, sans-serif" font-size="12" font-weight="700">IMPLEMENTADO EN EL REPOSITORIO</text>
<g>
<rect x="16" y="56" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="82" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Petición de exportación</tspan>
<tspan x="30" dy="21">Exigir biblioteca sin error</tspan>
<tspan x="30" dy="21">Sin escrituras pendientes</tspan>
<tspan x="30" dy="21">Guardar revisión local inicial</tspan>
</text>
</g>
<path d="M160 165 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="175" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="190" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">fetchLibraryForExport</text>
<g>
<rect x="16" y="217" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="243" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Leer servidor por cursores</tspan>
<tspan x="30" dy="21">Hasta 5001 docs por consulta</tspan>
<tspan x="30" dy="21">Avanzar desde último ID usado</tspan>
<tspan x="30" dy="21">Comprobar sesión en cada página</tspan>
</text>
</g>
<path d="M160 326 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="336" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="351" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">reunir páginas</text>
<g>
<rect x="16" y="378" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="404" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Verificar antes de descargar</tspan>
<tspan x="30" dy="21">Sin caché ni escrituras pendientes</tspan>
<tspan x="30" dy="21">Máximo 10000; fallo → sin copia</tspan>
<tspan x="30" dy="21">UID y revisión local sin cambios</tspan>
</text>
</g>
<path d="M160 487 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="497" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="512" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">serializar en navegador</text>
<g>
<rect x="16" y="539" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="565" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">JSON / CSV o copia dividida</tspan>
<tspan x="30" dy="21">JSON v2 incluye procedencia</tspan>
<tspan x="30" dy="21">CSV neutraliza fórmulas</tspan>
<tspan x="30" dy="21">Copia grande: partes + manifiesto</tspan>
</text>
</g>
<path d="M160 648 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="658" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="673" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">selección explícita de archivos</text>
<g>
<rect x="16" y="700" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="726" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Restaurar copia dividida</tspan>
<tspan x="30" dy="21">Verificar conjunto y hashes</tspan>
<tspan x="30" dy="21">Vincular plan al UID actual</tspan>
<tspan x="30" dy="21">Reanudar con IDs estables</tspan>
</text>
</g>
</svg>
