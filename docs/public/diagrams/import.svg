<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 825" role="img" aria-labelledby="title desc">
<title id="title">Importación recuperable</title>
<desc id="desc">Archivo JSON / CSV / TXT. Leer y normalizar en navegador. Validar campos y fuentes. Errores visibles en previsualización → Previsualización + selección. Detectar duplicados por nombre. Elegir filas válidas a guardar. Comprobar UID de la selección → Identidad estable de fila. SHA-256 de UID + formato + texto. ID: import-v1-hash-fila. Reintento del mismo archivo y UID → Transacción por obra. Si ID existe: no sobrescribir. Si no existe: crear con timestamps. Hasta 8 operaciones concurrentes → Confirmación o interrupción. Éxitos quedan identificados. Cuota o cambio UID detiene avance. Releer archivo permite reintentar. Las condiciones y excepciones se detallan en el texto de la página.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10" fill="#4338ca"/>
</marker>
</defs>
<rect width="320" height="825" rx="12" fill="#f1f0fa"/>
<text x="16" y="30" fill="#4338ca" font-family="system-ui, sans-serif" font-size="12" font-weight="700">IMPLEMENTADO EN EL REPOSITORIO</text>
<g>
<rect x="16" y="56" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="82" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Archivo JSON / CSV / TXT</tspan>
<tspan x="30" dy="21">Leer y normalizar en navegador</tspan>
<tspan x="30" dy="21">Validar campos y fuentes</tspan>
<tspan x="30" dy="21">Errores visibles en previsualización</tspan>
</text>
</g>
<path d="M160 165 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="175" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="190" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">crear preview</text>
<g>
<rect x="16" y="217" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="243" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Previsualización + selección</tspan>
<tspan x="30" dy="21">Detectar duplicados por nombre</tspan>
<tspan x="30" dy="21">Elegir filas válidas a guardar</tspan>
<tspan x="30" dy="21">Comprobar UID de la selección</tspan>
</text>
</g>
<path d="M160 326 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="336" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="351" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">vincular archivo y cuenta</text>
<g>
<rect x="16" y="378" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="404" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Identidad estable de fila</tspan>
<tspan x="30" dy="21">SHA-256 de UID + formato + texto</tspan>
<tspan x="30" dy="21">ID: import-v1-hash-fila</tspan>
<tspan x="30" dy="21">Reintento del mismo archivo y UID</tspan>
</text>
</g>
<path d="M160 487 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="497" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="512" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">mangaStore.createManga</text>
<g>
<rect x="16" y="539" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="565" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Transacción por obra</tspan>
<tspan x="30" dy="21">Si ID existe: no sobrescribir</tspan>
<tspan x="30" dy="21">Si no existe: crear con timestamps</tspan>
<tspan x="30" dy="21">Hasta 8 operaciones concurrentes</tspan>
</text>
</g>
<path d="M160 648 v42" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="21" y="658" width="278" height="22" fill="#f1f0fa"/>
<text x="160" y="673" text-anchor="middle" fill="#4338ca" font-family="system-ui, sans-serif" font-size="11">resultado por fila</text>
<g>
<rect x="16" y="700" width="288" height="109" rx="10" fill="#ffffff" stroke="#4338ca"/>
<text x="30" y="726" fill="#222139" font-family="system-ui, sans-serif" font-size="14.5">
<tspan x="30" dy="0" font-weight="700">Confirmación o interrupción</tspan>
<tspan x="30" dy="21">Éxitos quedan identificados</tspan>
<tspan x="30" dy="21">Cuota o cambio UID detiene avance</tspan>
<tspan x="30" dy="21">Releer archivo permite reintentar</tspan>
</text>
</g>
</svg>
